services:
  db:
    image: postgres:15-alpine
    container_name: marketing_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-marketing_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_marketing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-marketing_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - marketing_net

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: marketing_ai_app
    restart: unless-stopped
    ports:
      - "${PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - PORT=${PORT:-8001}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - TIKTOK_CLIENT_KEY=${TIKTOK_CLIENT_KEY}
      - TIKTOK_CLIENT_SECRET=${TIKTOK_CLIENT_SECRET}
      - TIKTOK_REDIRECT_URI=${TIKTOK_REDIRECT_URI:-http://localhost:8001/auth/tiktok/callback}
      - TIKTOK_SANDBOX_MODE=${TIKTOK_SANDBOX_MODE:-true}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_NAME=${DB_NAME:-marketing_db}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - media_marketing_data:/app/media
      - ./app:/app/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - marketing_net

volumes:
  postgres_marketing_data:
    name: postgres_marketing_data
  media_marketing_data:
    name: media_marketing_data

networks:
  marketing_net:
    name: marketing_network
    driver: bridge

